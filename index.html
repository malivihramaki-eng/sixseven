<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏠%3C/text%3E%3C/svg%3E">
<title>SixSeven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700;900&family=IBM+Plex+Mono:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700;800&display=swap">
<style>
/* ===== TOKENS (ProdVisor) — acento e neutros trocam por conta via JS ===== */
:root{
  --f-display:'IBM Plex Sans','Inter',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --f-numeric:'Geist Mono','IBM Plex Mono',ui-monospace,monospace;

  --acc:#34d472; --acc-rgb:34,197,94;
  --tx-1:#eef6f0; --tx-2:#c5d9ca; --tx-3:#a8c4af; --tx-4:#8b9a90; --tx-5:#2a3d2e;

  --ok:#34d472; --ok-rgb:34,197,94;
  --amber:#f59e0b; --rose:#f43f5e; --blue:#60a5fa; --violet:#a78bfa;

  --radius:6px; --radius-md:8px; --radius-lg:10px; --radius-xl:16px;
  --ease:cubic-bezier(.4,0,.2,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1); --ease-soft:cubic-bezier(.34,1.2,.64,1);

  --ch-grid:rgba(255,255,255,.07);
}

/* ===== RESET / BASE ===== */
*{margin:0;padding:0;box-sizing:border-box}
html{background:#000}
body{
  font-family:var(--f-display);background:#000;color:var(--tx-2);min-height:100vh;
  font-size:16px;letter-spacing:-.01em;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:geometricPrecision;
  -webkit-tap-highlight-color:transparent;
}
/* vinheta: a única fonte de profundidade do fundo */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 900px 700px at 15% -5%,rgba(var(--acc-rgb),.10),transparent 60%),
    radial-gradient(ellipse 700px 600px at 92% 110%,rgba(var(--acc-rgb),.07),transparent 55%),
    radial-gradient(ellipse 500px 400px at 50% 50%,rgba(var(--acc-rgb),.03),transparent 70%);
}
::selection{background:var(--acc);color:#001a10}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(var(--acc-rgb),0);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(var(--acc-rgb),.2)}
#app{position:relative;z-index:2;max-width:520px;margin:0 auto;padding:16px 16px 120px}
h1,h2,h3{font-weight:600;color:var(--tx-1);letter-spacing:-.02em}
button{font-family:inherit}

/* ===== TIPOGRAFIA: mono é a voz; números fecham, rótulos abrem ===== */
.cap{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-4)}
.numeral{font-family:var(--f-numeric);font-weight:700;letter-spacing:-.03em;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-feature-settings:"ss01","tnum"}
.centro{text-align:center}

/* ===== MATERIAIS ===== */
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);border-radius:var(--radius-xl);padding:18px;margin:14px 0}
.luz{background:linear-gradient(135deg,rgba(var(--acc-rgb),.16),rgba(var(--acc-rgb),.04));border:1.5px solid rgba(var(--acc-rgb),.5);
  box-shadow:0 0 24px rgba(var(--acc-rgb),.15),0 0 60px rgba(var(--acc-rgb),.06)}
.poco,textarea,input[type=text],input[type=number]{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14);border-radius:var(--radius-md);
  color:var(--tx-1);font-family:var(--f-mono);font-size:15px;padding:12px;width:100%;margin:6px 0;transition:border-color .2s,box-shadow .2s;outline:none}
textarea:focus,input:focus{border-color:rgba(var(--acc-rgb),.5);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.12)}
textarea{min-height:76px;resize:vertical}
::placeholder{color:var(--tx-4);opacity:.7}

/* ===== LED / CHIPS ===== */
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);flex-shrink:0}
.is-ok .led,.led.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(var(--ok-rgb),.18);animation:softPulse 2.6s ease-in-out infinite}
.is-pend .led,.led.pend{background:var(--amber);box-shadow:0 0 0 3px rgba(245,158,11,.18)}
.is-stop .led,.led.stop{background:var(--rose);box-shadow:0 0 0 3px rgba(244,63,94,.18)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;font-weight:700;padding:5px 10px;border-radius:var(--radius-lg);letter-spacing:.04em}
.chip-verde{background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.25);color:#34d472}
.chip-ambar{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.30);color:#f59e0b}
.chip-rosa{background:rgba(244,63,94,.14);border:1px solid rgba(244,63,94,.30);color:#f43f5e}
.chip-acc{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);color:var(--tx-1)}

/* ===== BOTÕES ===== */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:12px;padding:16px;font-family:var(--f-display);font-size:18px;font-weight:600;
  color:var(--tx-1);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius-lg);cursor:pointer;transition:all .2s var(--ease)}
.btn:hover{border-color:rgba(var(--acc-rgb),.5);background:rgba(var(--acc-rgb),.08)}
.btn:active{transform:scale(.97)}
.btn.primario{background:linear-gradient(135deg,rgba(var(--acc-rgb),.16),rgba(var(--acc-rgb),.04));border:1.5px solid rgba(var(--acc-rgb),.5);
  box-shadow:0 0 24px rgba(var(--acc-rgb),.15),0 0 60px rgba(var(--acc-rgb),.06);font-size:20px}
.btn.ok{background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.35);color:#34d472;font-size:22px}
.btn.no{background:rgba(244,63,94,.14);border:1px solid rgba(244,63,94,.35);color:#f43f5e;font-size:22px}
.tb-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);color:rgba(255,255,255,.7);
  display:inline-flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all .25s var(--ease);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:0}
.tb-btn:hover{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.3)}
.tb-btn:active{transform:scale(.92)}
.tb-btn.off{opacity:.4}
.voltar{margin-bottom:6px}

/* ===== TOPO ===== */
.topo{display:flex;align-items:center;gap:12px;padding:6px 0 10px}
.topo .nome{font-family:var(--f-mono);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-1)}
.topo .espaco{flex:1}

/* ===== AVATAR ===== */
.avatar{border-radius:50%;border:2px solid var(--c,var(--acc));background:#050505;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;
  box-shadow:0 0 0 3px rgba(255,255,255,.03),0 0 22px color-mix(in srgb,var(--c,var(--acc)) 30%,transparent)}
.avatar img{width:100%;height:100%;object-fit:cover}

/* ===== HOME ===== */
.titulo{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px 0 8px}
.titulo span{font-size:30px}
.pessoa{display:flex;align-items:center;gap:18px;width:100%;margin:14px 0;padding:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);
  border-radius:var(--radius-xl);color:var(--tx-1);cursor:pointer;text-align:left;transition:all .3s var(--ease-spring);animation:sobe .5s both;animation-delay:calc(var(--i,0)*90ms)}
.pessoa:hover,.pessoa:active{transform:translateY(-3px) scale(1.01);border-color:color-mix(in srgb,var(--c) 60%,transparent);
  box-shadow:0 0 30px color-mix(in srgb,var(--c) 22%,transparent)}
.pessoa b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em}
.pessoa .sub{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:24px}

/* ===== PADRÃO DE DESENHO ===== */
.grade{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:26px;width:min(74vw,300px);margin:22px auto;touch-action:none;user-select:none}
.ponto{aspect-ratio:1;border-radius:50%;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.16);transition:all .2s var(--ease)}
.ponto.on{background:linear-gradient(135deg,rgba(var(--acc-rgb),.35),rgba(var(--acc-rgb),.1));border:1.5px solid rgba(var(--acc-rgb),.7);
  box-shadow:0 0 24px rgba(var(--acc-rgb),.35);transform:scale(1.12)}
.grade svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.grade svg polyline{fill:none;stroke:var(--acc);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.7;filter:drop-shadow(0 0 8px var(--acc))}
.grade.erro{animation:treme .45s}
.grade.erro .ponto{border-color:rgba(244,63,94,.7);background:rgba(244,63,94,.12)}
.dica{font-size:20px;margin:12px 0}

/* ===== ANEL ===== */
.anel{position:relative;width:150px;height:150px;flex-shrink:0}
.anel svg{transform:rotate(-90deg);display:block;width:100%;height:100%}
.anel-trilho{fill:none;stroke:rgba(255,255,255,.07);stroke-width:14}
.anel-fill{fill:none;stroke-width:14;stroke-linecap:round;filter:drop-shadow(0 0 9px rgba(var(--acc-rgb),.42));
  transition:stroke-dashoffset .85s cubic-bezier(.4,0,.2,1),stroke .4s ease}
.anel-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;pointer-events:none;font-family:var(--f-numeric)}
.anel-in .lbl{font-size:20px}
.anel-in .pct{font-size:34px;font-weight:700;color:#fff;line-height:1;letter-spacing:-.02em}
.anel-in .pct small{font-size:14px;font-weight:600;margin-left:1px;color:rgba(255,255,255,.6)}
.painel{display:flex;align-items:center;gap:20px}
.painel .col{flex:1;min-width:0}
.painel .numeral{font-size:42px;margin-top:8px}

/* ===== BARRA DE INFO ===== */
.info-bar{display:grid;grid-template-columns:1.3fr 1fr 1fr;border-radius:var(--radius-xl);border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.03);margin:14px 0;overflow:hidden}
.info-cell{padding:14px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-right:1px solid rgba(255,255,255,.06)}
.info-cell:last-child{border-right:none}
.info-cell .lbl{font-size:22px;line-height:1}
.info-cell .val{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--tx-1);display:inline-flex;align-items:center;gap:8px}

/* ===== SEMANA ===== */
.semana{display:flex;gap:6px;margin:14px 0}
.sem{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0 10px;border-radius:var(--radius-lg);background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);font-size:24px;transition:all .3s}
.sem small{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--tx-4)}
.sem.hoje{border-color:rgba(var(--acc-rgb),.6);background:rgba(var(--acc-rgb),.08);box-shadow:0 0 20px rgba(var(--acc-rgb),.18)}

/* ===== FOTO / ÁUDIO ===== */
.foto-grande{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:210px;background:rgba(0,0,0,.4);border:1.5px dashed rgba(255,255,255,.2);
  border-radius:var(--radius-xl);font-size:52px;cursor:pointer;overflow:hidden;transition:all .25s}
.foto-grande:active,.foto-grande:hover{border-color:rgba(var(--acc-rgb),.6)}
.foto-grande img{width:100%;height:100%;object-fit:cover}
.foto-atv{width:100%;border-radius:var(--radius-lg);margin:10px 0;max-height:360px;object-fit:cover;border:1px solid rgba(255,255,255,.08)}
.gravar{display:flex;justify-content:center;align-items:center;gap:16px;margin:18px 0 6px}
.rec-btn{width:84px;height:84px;border-radius:50%;font-size:34px;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,rgba(var(--acc-rgb),.2),rgba(var(--acc-rgb),.05));border:1.5px solid rgba(var(--acc-rgb),.55);box-shadow:0 0 24px rgba(var(--acc-rgb),.2);transition:all .2s}
.rec-btn:active{transform:scale(.93)}
.rec-btn.rec{background:rgba(244,63,94,.18);border-color:rgba(244,63,94,.7);box-shadow:0 0 0 8px rgba(244,63,94,.15),0 0 30px rgba(244,63,94,.35);animation:softPulse 1s infinite}
audio{width:100%;margin:10px 0;color-scheme:dark}

/* ===== LISTAS ===== */
.item{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);border-radius:var(--radius-xl);padding:14px;margin:10px 0;transition:transform .15s}
.item.inativo{opacity:.35}
.item .ico{font-size:42px;width:54px;text-align:center}
.item .info{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.item .info b{font-size:17px;font-weight:600;color:var(--tx-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .info span{font-family:var(--f-numeric);font-size:15px;font-weight:700;color:var(--tx-3)}
.item .tb-btn{width:48px;height:48px;font-size:22px}
.item .tb-btn.conf{background:rgba(var(--acc-rgb),.18);border-color:rgba(var(--acc-rgb),.6)}
.linha{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:20px}
.linha:last-child{border-bottom:none}
.linha .v{font-family:var(--f-numeric);font-weight:700;letter-spacing:-.02em;font-size:17px}
.linha small{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--tx-4)}
.pos{color:var(--ok)}.neg{color:#f87171}

/* ===== AVALIAR ===== */
.atv{transition:opacity .3s,transform .3s var(--ease-spring)}
.atv.dim{opacity:.7}
.atv-topo{display:flex;align-items:center;gap:12px}
.atv-topo b{font-size:19px;font-weight:600;color:var(--tx-1)}
.atv-topo .cap{margin-left:auto}
.nota{display:flex;align-items:center;gap:14px;margin-top:6px}
.nota input{flex:1;margin:0;padding:0;background:none;border:none;box-shadow:none;accent-color:var(--acc);height:34px}
.nota .numeral{font-size:34px;min-width:50px;text-align:right}
.botoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}

/* ===== DADOS ===== */
.dados-topo{display:flex;align-items:center;gap:18px;margin:8px 0 4px}
.dados-topo .anel{width:130px;height:130px}
.dados-topo .anel-in .pct{font-size:30px}
.tiles{flex:1;display:grid;gap:8px}
.tile{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-lg);padding:10px 12px;font-size:24px}
.tile b{font-family:var(--f-numeric);font-size:22px;font-weight:700;color:#fff;letter-spacing:-.02em}
.grafico{width:100%;height:160px;margin-top:10px}
.grafico circle{animation:pop .4s both;transform-box:fill-box;transform-origin:center}
.grafico .ma{fill:none;stroke:var(--violet);stroke-width:2.5;stroke-dasharray:1000;stroke-dashoffset:1000;animation:desenha 1.2s .2s forwards;filter:drop-shadow(0 0 6px rgba(167,139,250,.5))}
.grafico .guia{stroke:var(--ch-grid);stroke-dasharray:3 4}
.legenda{display:flex;gap:16px;margin-top:4px;font-family:var(--f-mono);font-size:11px;color:var(--tx-4);letter-spacing:.06em}
.legenda i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dias{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px}
.dia{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:50px;padding:8px 4px;border-radius:var(--radius-lg);background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);font-size:18px}
.dia b{font-family:var(--f-numeric);font-size:18px;color:var(--tx-1)}
.dia b.pos{color:var(--ok)}.dia b.neg{color:#f87171}
.dia small{font-family:var(--f-mono);font-size:10px;color:var(--tx-4);letter-spacing:.08em}

/* ===== MODOS (navegação acromática) ===== */
.tabs{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;display:flex;gap:6px;padding:6px;border-radius:var(--radius-xl);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 32px rgba(0,0,0,.8)}
.mode-btn{position:relative;width:84px;height:54px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:var(--radius-lg);
  color:rgba(255,255,255,.77);font-size:26px;cursor:pointer;transition:all .3s var(--ease)}
.mode-btn:hover{background:rgba(255,255,255,.05)}
.mode-btn.on{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.mode-btn .e{opacity:.7;transition:all .3s}
.mode-btn.on .e{opacity:1;transform:scale(1.15)}
.badge{position:absolute;top:2px;right:10px;background:var(--rose);color:#fff;font-family:var(--f-numeric);font-size:12px;font-weight:700;border-radius:999px;min-width:20px;padding:2px 6px;text-align:center;animation:pop .4s}

/* ===== TOAST / CARGA / CONFETE ===== */
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;width:min(92vw,360px);pointer-events:none}
.toast{display:flex;gap:9px;position:relative;overflow:hidden;background:rgba(10,14,11,.96);border:1px solid rgba(255,255,255,.09);border-left:3px solid rgba(255,255,255,.18);
  border-radius:var(--radius-md);padding:12px 14px;font-family:var(--f-mono);font-size:14px;font-weight:500;color:rgba(240,250,240,.92);
  box-shadow:0 4px 20px rgba(0,0,0,.5);animation:toastIn .25s var(--ease-soft) both}
.toast::after{content:'';position:absolute;bottom:0;left:0;height:2px;width:100%;background:currentColor;opacity:.18;animation:toastBar var(--toast-dur,4s) linear forwards}
.toast-success{border-left-color:rgba(93,214,44,.9);color:rgba(220,255,220,.92)}
.toast-error{border-left-color:rgba(244,63,94,.9);color:rgba(255,220,220,.92)}
.toast-warn{border-left-color:rgba(245,158,11,.9);color:rgba(255,240,220,.92)}
#carga{position:fixed;top:0;left:0;height:2px;width:0;opacity:0;background:var(--acc);box-shadow:0 0 10px var(--acc);transition:width .8s,opacity .3s;z-index:10000}
#confete{position:fixed;inset:0;pointer-events:none;z-index:9800}

/* ===== MOVIMENTO ===== */
@keyframes sobe{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes treme{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes softPulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes pulseBorder{0%,100%{box-shadow:0 0 24px rgba(var(--acc-rgb),.15),0 0 60px rgba(var(--acc-rgb),.06)}50%{box-shadow:0 0 30px rgba(var(--acc-rgb),.3),0 0 70px rgba(var(--acc-rgb),.12)}}
@keyframes desenha{to{stroke-dashoffset:0}}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastBar{from{transform:scaleX(1);transform-origin:left}to{transform:scaleX(0);transform-origin:left}}
.entra>*{animation:sobe .45s cubic-bezier(.2,.8,.2,1) both}
.entra>*:nth-child(2){animation-delay:.06s}.entra>*:nth-child(3){animation-delay:.12s}
.entra>*:nth-child(4){animation-delay:.18s}.entra>*:nth-child(5){animation-delay:.24s}
.card.centro>.grande-emoji{animation:pop .6s both}
.grande-emoji{font-size:70px;line-height:1.1}
.luz.pulsa{animation:pulseBorder 2.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.grafico .ma{stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="app"><div class="card centro"><div class="grande-emoji">⏳</div></div></div>
<div id="carga"></div>
<canvas id="confete"></canvas>
<div id="toasts"></div>

<script>
/* ===== CONFIG ===== */
const API = 'https://script.google.com/macros/s/AKfycbyU52uWZeRoo2uKbpgVy7LLMn0BJF7MZE3KWd4aIEgC7zr-xZs082mlHKugip41MJv_Fg/exec';

/* Temas: acento + neutros tingidos do mesmo matiz (regra R2) */
const TEMAS = {
  verde:  { acc: '#34d472', rgb: '34,197,94',   t: ['#eef6f0', '#c5d9ca', '#a8c4af', '#8b9a90', '#2a3d2e'] },
  azul:   { acc: '#60a5fa', rgb: '96,165,250',  t: ['#eef3fb', '#c5d0e0', '#a8b8cf', '#8b96a8', '#2a3447'] },
  branco: { acc: '#ffffff', rgb: '255,255,255', t: ['#f4f4f4', '#d0d0d0', '#b0b0b0', '#8e8e8e', '#333333'] },
};
const temaDe = cor => {
  const c = String(cor || '').toLowerCase();
  return c === '#3b82f6' ? TEMAS.azul : c === '#ffffff' || c === '#fff' ? TEMAS.branco : TEMAS.verde;
};

/* ===== ESTADO ===== */
const $ = s => document.querySelector(s);
const app = $('#app');
const S = { usuarios: [], escolhido: null, user: null, hash: null, dados: null, aba: 'inicio',
  passo: 1, p1: null, fotoB64: null, fotoPrev: null, form: { descricao: '' },
  gravando: false, rec: null, notas: {}, toqueKey: null, anim: true, saldoAnt: null, shake: false, checar: false };

/* ===== HELPERS ===== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const real = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(v) || 0);
const fotoUrl = id => id ? `https://drive.google.com/thumbnail?sz=w800&id=${id}` : '';
const audioUrl = id => id ? `https://drive.google.com/uc?export=download&id=${id}` : '';
const vibrar = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
document.addEventListener('pointerdown', e => {
  if (e.target.closest('.btn,.tb-btn,.mode-btn,.pessoa,.rec-btn')) vibrar(8);
});

function toast(m) {
  const tipo = /^❌/.test(m) ? 'error' : /^(⚠️|💸|🎙️|📷)/.test(m) ? 'warn' : /^(✅|🎉)/.test(m) ? 'success' : '';
  const el = document.createElement('div');
  el.className = 'toast' + (tipo ? ' toast-' + tipo : '');
  el.style.setProperty('--toast-dur', '3.6s');
  el.textContent = m;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

async function sha(texto) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}

const blobBase64 = b => new Promise(ok => {
  const r = new FileReader();
  r.onload = () => ok(r.result.split(',')[1]);
  r.readAsDataURL(b);
});

function lerImagem(file, lado) {
  return new Promise((ok, err) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, lado / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', 0.7).split(',')[1]);
    };
    img.onerror = err;
    img.src = URL.createObjectURL(file);
  });
}

function tema(cor) {
  const t = temaDe(cor), s = document.documentElement.style;
  s.setProperty('--acc', t.acc);
  s.setProperty('--acc-rgb', t.rgb);
  ['--tx-1', '--tx-2', '--tx-3', '--tx-4', '--tx-5'].forEach((k, i) => s.setProperty(k, t.t[i]));
}

function avatar(u, tam = 96) {
  const c = temaDe(u.cor).acc;
  const img = u.foto ? `<img src="${fotoUrl(u.foto)}">` : (u.tipo === 'admin' ? '👑' : '🧒');
  return `<div class="avatar" style="width:${tam}px;height:${tam}px;--c:${c};font-size:${Math.round(tam * 0.45)}px">${img}</div>`;
}

async function api(acao, extra = {}) {
  carga(true);
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ acao, user: S.user, hash: S.hash, ...extra }),
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.erro || 'Erro');
    return j;
  } finally {
    carga(false);
  }
}

function carga(on) {
  const b = $('#carga');
  clearTimeout(carga.t);
  if (on) { b.style.opacity = 1; b.style.width = '80%'; }
  else {
    b.style.width = '100%';
    carga.t = setTimeout(() => { b.style.opacity = 0; b.style.width = 0; }, 300);
  }
}

function festa() {
  const c = $('#confete'), g = c.getContext('2d');
  c.width = innerWidth;
  c.height = innerHeight;
  const cores = [getComputedStyle(document.documentElement).getPropertyValue('--acc').trim() || '#fff', '#34d472', '#f59e0b', '#60a5fa', '#a78bfa', '#ffffff'];
  const ps = Array.from({ length: 90 }, () => ({
    x: innerWidth / 2, y: innerHeight * 0.6,
    vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 16 - 4,
    r: Math.random() * 6 + 3, cor: cores[Math.random() * cores.length | 0],
    rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
  }));
  let t = 0;
  (function quadro() {
    g.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => {
      p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.rot);
      g.fillStyle = p.cor; g.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
      g.restore();
    });
    if (++t < 110) requestAnimationFrame(quadro); else g.clearRect(0, 0, c.width, c.height);
  })();
  vibrar([30, 40, 30]);
}

function animarSaldo() {
  const el = $('#saldo');
  if (!el) return;
  const novo = Number(S.dados.saldo) || 0, ant = S.saldoAnt ?? novo;
  S.saldoAnt = novo;
  if (ant === novo) return;
  const t0 = performance.now();
  (function q(t) {
    const k = Math.min(1, (t - t0) / 700);
    el.textContent = real(ant + (novo - ant) * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(q);
  })(t0);
}

function animarAneis() {
  const C = 2 * Math.PI * 96;
  document.querySelectorAll('.anel-fill').forEach(el => {
    el.style.strokeDasharray = C;
    el.style.strokeDashoffset = C;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.strokeDashoffset = C * (1 - Math.max(0, Math.min(100, Number(el.dataset.pct))) / 100);
    }));
  });
}

function anel(pct, centro, cor) {
  return `<div class="anel"><svg viewBox="0 0 220 220" aria-hidden="true">
    <circle class="anel-trilho" cx="110" cy="110" r="96"/>
    <circle class="anel-fill" data-pct="${pct}" style="stroke:${cor}" cx="110" cy="110" r="96"/>
  </svg><div class="anel-in">${centro}</div></div>`;
}

function checarAprovadas() {
  if (S.dados.perfil.tipo === 'admin') return;
  const chave = 'ss_vistas_' + S.user;
  let vistas = [];
  try { vistas = JSON.parse(localStorage.getItem(chave)) || []; } catch (e) {}
  const novas = S.dados.atividades.filter(a => a.status === 'aprovado' && !vistas.includes(a.id));
  if (!novas.length) return;
  try { localStorage.setItem(chave, JSON.stringify(vistas.concat(novas.map(a => a.id)))); } catch (e) {}
  festa();
  toast('🎉 Aprovado! 💰');
}

function guardarSessao() { try { sessionStorage.setItem('sixseven', JSON.stringify({ user: S.user, hash: S.hash })); } catch (e) {} }
function lerSessao() { try { return JSON.parse(sessionStorage.getItem('sixseven')); } catch (e) { return null; } }
function limparSessao() { try { sessionStorage.removeItem('sixseven'); } catch (e) {} }

/* ===== INÍCIO ===== */
async function iniciar() {
  try {
    const r = await fetch(API).then(x => x.json());
    if (!r.ok) throw new Error();
    S.usuarios = r.usuarios;
  } catch (e) {
    app.innerHTML = '<div class="card centro"><div class="grande-emoji">⚠️</div><p>Não consegui falar com o banco de dados.</p></div>';
    return;
  }
  const sess = lerSessao();
  if (sess && sess.user) {
    S.user = sess.user;
    S.hash = sess.hash;
    S.escolhido = S.usuarios.find(u => u.id === sess.user);
    try {
      S.dados = await api('entrar');
      S.aba = S.dados.perfil.tipo === 'admin' ? 'avaliar' : 'inicio';
      S.anim = S.checar = true;
      return telaApp();
    } catch (e) {
      S.user = S.hash = null;
      limparSessao();
    }
  }
  telaHome();
}

function telaHome() {
  S.user = S.hash = S.dados = null;
  limparSessao();
  tema(null);
  app.innerHTML = `<div class="titulo"><span>🏠</span></div>` + S.usuarios.map((u, i) => `
    <button class="pessoa" style="--c:${temaDe(u.cor).acc};--i:${i}" onclick="escolher('${esc(u.id)}')">
      ${avatar(u, 84)}
      <div><b>${esc(u.nome)}</b><div class="sub">${u.tipo === 'admin' ? '👑' : '🧒'} ${u.configurado ? '🔒' : '🆕'}</div></div>
    </button>`).join('');
}

function escolher(id) {
  S.escolhido = S.usuarios.find(u => u.id === id);
  S.passo = 1;
  S.p1 = null;
  S.fotoB64 = S.fotoPrev = null;
  telaLogin();
}

/* ===== LOGIN / PRIMEIRO ACESSO (padrão de desenho para todos) ===== */
function grade() {
  const erro = S.shake ? ' erro' : '';
  S.shake = false;
  return `<div class="grade${erro}" id="grade">${Array.from({ length: 9 }, (_, i) => `<div class="ponto" data-i="${i}"></div>`).join('')}</div>`;
}

function ligarGrade(fim) {
  const g = $('#grade');
  let seq = [], ativo = false;
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  const linha = document.createElementNS(NS, 'polyline');
  svg.appendChild(linha);
  g.appendChild(svg);
  const desenhar = e => {
    const a = g.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${a.width} ${a.height}`);
    const pts = seq.map(i => {
      const b = g.children[i].getBoundingClientRect();
      return `${b.left - a.left + b.width / 2},${b.top - a.top + b.height / 2}`;
    });
    if (e) pts.push(`${e.clientX - a.left},${e.clientY - a.top}`);
    linha.setAttribute('points', pts.join(' '));
  };
  const tocar = e => {
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const i = el?.dataset?.i;
    if (i != null && !seq.includes(+i)) {
      seq.push(+i);
      el.classList.add('on');
      vibrar(6);
    }
    desenhar(e);
  };
  g.onpointerdown = e => {
    seq = [];
    g.classList.remove('erro');
    g.querySelectorAll('.ponto').forEach(p => p.classList.remove('on'));
    g.setPointerCapture(e.pointerId);
    ativo = true;
    tocar(e);
  };
  g.onpointermove = e => { if (ativo) tocar(e); };
  g.onpointerup = () => {
    if (!ativo) return;
    ativo = false;
    desenhar();
    setTimeout(() => fim(seq.slice()), 120);
  };
}

function telaLogin() {
  const u = S.escolhido;
  tema(u.cor);
  const cab = `<div style="text-align:left"><button class="tb-btn voltar" onclick="telaHome()">⬅️</button></div>${avatar(u, 112)}<h2 style="margin-top:12px">${esc(u.nome)}</h2>`;
  if (!u.configurado) return primeiroAcesso(cab);
  app.innerHTML = `<div class="centro entra">${cab}<p class="dica">🔒</p>${grade()}</div>`;
  ligarGrade(p => {
    if (p.length < 4) { toast('⚠️ Use pelo menos 4 pontinhos'); return telaLogin(); }
    entrar(p.join('-'));
  });
}

async function entrar(texto) {
  S.user = S.escolhido.id;
  S.hash = await sha(texto);
  try {
    S.dados = await api('entrar');
    guardarSessao();
    S.aba = S.dados.perfil.tipo === 'admin' ? 'avaliar' : 'inicio';
    S.anim = S.checar = true;
    S.saldoAnt = null;
    telaApp();
  } catch (e) {
    S.user = S.hash = null;
    S.shake = true;
    vibrar([60, 40, 60]);
    toast('❌ ' + e.message);
    telaLogin();
  }
}

function primeiroAcesso(cab) {
  if (S.passo < 3) {
    app.innerHTML = `<div class="centro entra">${cab}<p class="dica">${S.passo === 1 ? '1️⃣ 🔒 ✏️' : '2️⃣ 🔁 ✅'}</p>${grade()}</div>`;
    ligarGrade(p => {
      const t = p.join('-');
      if (p.length < 4) { toast('⚠️ Use pelo menos 4 pontinhos'); return telaLogin(); }
      if (S.passo === 1) { S.p1 = t; S.passo = 2; return telaLogin(); }
      if (t !== S.p1) { toast('❌ Não bateu, tente de novo'); S.shake = true; S.passo = 1; return telaLogin(); }
      S.passo = 3;
      telaLogin();
    });
    return;
  }
  app.innerHTML = `<div class="centro entra">${cab}<p class="dica">3️⃣ 📷</p>
    <label class="foto-grande" style="width:210px;height:210px;border-radius:50%;margin:0 auto">
      ${S.fotoPrev ? `<img src="${S.fotoPrev}">` : '📷'}
      <input type="file" accept="image/*" capture="user" hidden onchange="fotoPerfil(this)">
    </label>
    <button class="btn primario" onclick="salvarPerfil()">✅</button>
  </div>`;
}

async function fotoPerfil(inp) {
  const f = inp.files[0];
  if (!f) return;
  S.fotoB64 = await lerImagem(f, 300);
  S.fotoPrev = 'data:image/jpeg;base64,' + S.fotoB64;
  telaLogin();
}

async function salvarPerfil() {
  if (!S.fotoB64) return toast('📷 Escolha sua foto');
  S.user = S.escolhido.id;
  S.hash = await sha(S.p1);
  try {
    await api('configurar', { foto: S.fotoB64 });
    S.escolhido.configurado = true;
    S.passo = 1;
    S.fotoB64 = S.fotoPrev = null;
    await entrar(S.p1);
  } catch (e) {
    toast('❌ ' + e.message);
  }
}

/* ===== APP ===== */
async function atualizar() {
  S.dados = await api('entrar');
  telaApp();
}

function irAba(a) {
  S.aba = a;
  S.anim = true;
  telaApp();
}

function sair() {
  S.user = S.hash = S.dados = null;
  S.form = { descricao: '' };
  limparSessao();
  telaHome();
}

function confirmar(chave, acao) {
  if (S.toqueKey !== chave) {
    S.toqueKey = chave;
    telaApp();
    return toast('⚠️ Toque de novo para confirmar');
  }
  S.toqueKey = null;
  acao();
}

function telaApp() {
  const p = S.dados.perfil;
  const admin = p.tipo === 'admin';
  tema(p.cor);
  const abas = admin
    ? [['avaliar', '📋'], ['dados', '📊'], ['loja', '🛒']]
    : [['inicio', '🏠'], ['carteira', '👛'], ['loja', '🛒']];
  const vistas = { inicio: viewInicio, carteira: viewCarteira, loja: viewLoja, avaliar: viewAvaliar, dados: viewDados };
  const pend = S.dados.atividades.filter(a => a.status === 'pendente').length;
  const anim = S.anim ? 'entra' : '';
  S.anim = false;
  app.innerHTML = `
    <header class="topo">${avatar(p, 44)}<span class="nome">${esc(p.nome)}</span><span class="espaco"></span>
      <button class="tb-btn" onclick="sair()">🚪</button>
    </header>
    <main class="${anim}">${vistas[S.aba]()}</main>
    <nav class="tabs">${abas.map(([k, ic]) => `<button class="mode-btn ${S.aba === k ? 'on' : ''}" onclick="irAba('${k}')"><span class="e">${ic}</span>${admin && k === 'avaliar' && pend ? `<span class="badge">${pend}</span>` : ''}</button>`).join('')}</nav>`;
  animarAneis();
  animarSaldo();
  if (S.checar) { S.checar = false; checarAprovadas(); }
}

/* ----- Crianças ----- */
function diasSemana() {
  const h = S.dados.hoje, [y, m, d] = h.data.split('-').map(Number);
  const seg = Date.UTC(y, m - 1, d) - (h.diaSemana - 1) * 864e5;
  return ['S', 'T', 'Q', 'Q', 'S'].map((l, i) => {
    const dt = new Date(seg + i * 864e5).toISOString().slice(0, 10);
    return { l, dt, a: S.dados.atividades.find(x => x.data === dt), hoje: dt === h.data };
  });
}

function semana(dias) {
  const h = S.dados.hoje;
  return `<div class="semana">${dias.map(({ l, dt, a, hoje }) => {
    const ic = a ? { pendente: '⏳', aprovado: '✅', negado: '❌' }[a.status] : (dt < h.data ? '▫️' : '⚪');
    return `<div class="sem ${hoje ? 'hoje' : ''}">${ic}<small>${l}</small></div>`;
  }).join('')}</div>`;
}

function viewInicio() {
  const dias = diasSemana();
  const aprov = dias.filter(d => d.a && d.a.status === 'aprovado').length;
  const h = S.dados.hoje;
  const hj = S.dados.atividades.find(a => a.data === h.data);
  const notas = S.dados.atividades.filter(a => a.nota !== '' && a.nota != null).map(a => Number(a.nota));
  const media = notas.length ? (notas.reduce((s, x) => s + x, 0) / notas.length).toFixed(1) : '–';
  const st = h.diaSemana > 5 ? ['', 'Folga'] : !hj ? ['', 'Falta'] : { pendente: ['is-pend', 'Esperando'], aprovado: ['is-ok', 'Aprovado'], negado: ['is-stop', 'Negado'] }[hj.status];
  const dd = h.data.slice(8) + '/' + h.data.slice(5, 7);
  return `
    <div class="card painel">
      ${anel(aprov * 20, `<span class="lbl">📅</span><span class="pct">${aprov}<small>/5</small></span>`, 'var(--acc)')}
      <div class="col"><div class="cap">💰</div><div class="numeral" id="saldo">${real(S.saldoAnt ?? S.dados.saldo)}</div></div>
    </div>
    <div class="info-bar">
      <div class="info-cell ${st[0]}"><span class="lbl">🚦</span><span class="val"><i class="led"></i>${st[1]}</span></div>
      <div class="info-cell"><span class="lbl">📅</span><span class="val">${dd}</span></div>
      <div class="info-cell"><span class="lbl">⭐</span><span class="val">${media}</span></div>
    </div>
    ${semana(dias)}
    ${corpoInicio(hj)}`;
}

function corpoInicio(hj) {
  const h = S.dados.hoje;
  if (h.diaSemana > 5) {
    return `<div class="card centro"><div class="grande-emoji">🏖️</div><h2>😊</h2></div>`;
  }
  if (hj) {
    const cls = { pendente: 'chip-ambar', aprovado: 'chip-verde', negado: 'chip-rosa' }[hj.status];
    const ic = { pendente: '⏳', aprovado: '✅', negado: '❌' }[hj.status];
    return `<div class="card centro ${hj.status === 'aprovado' ? 'luz' : ''}">
      <div class="grande-emoji">${ic}</div>
      ${hj.nota !== '' && hj.nota != null ? `<span class="chip ${cls}">⭐ ${hj.nota}/10</span>` : ''}
      <img class="foto-atv" src="${fotoUrl(hj.foto)}">
    </div>`;
  }
  const f = S.form;
  return `<div class="card">
    <div class="centro"><div class="grande-emoji">📸</div></div>
    <label class="foto-grande">${f.fotoPrev ? `<img src="${f.fotoPrev}">` : '📷'}
      <input type="file" accept="image/*" capture="environment" hidden onchange="formFoto(this)">
    </label>
    <div class="gravar">
      <button class="rec-btn ${S.gravando ? 'rec' : ''}" onclick="gravar()">${S.gravando ? '⏹️' : '🎙️'}</button>
      <label class="tb-btn" style="width:52px;height:52px;font-size:22px">📁<input type="file" accept="audio/*" hidden onchange="formAudio(this)"></label>
    </div>
    ${f.audioUrl ? `<audio controls src="${f.audioUrl}"></audio>` : ''}
    <textarea placeholder="✏️" oninput="S.form.descricao=this.value">${esc(f.descricao)}</textarea>
    <button class="btn primario" onclick="enviarAtividade()">📤</button>
  </div>`;
}

async function formFoto(inp) {
  const f = inp.files[0];
  if (!f) return;
  S.form.fotoB64 = await lerImagem(f, 900);
  S.form.fotoPrev = 'data:image/jpeg;base64,' + S.form.fotoB64;
  telaApp();
}

async function gravar() {
  if (S.rec && S.rec.state === 'recording') return S.rec.stop();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const rec = S.rec = new MediaRecorder(stream);
    const partes = [];
    rec.ondataavailable = e => partes.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(partes, { type: rec.mimeType || 'audio/webm' });
      S.form.audioB64 = await blobBase64(blob);
      S.form.audioMime = blob.type;
      S.form.audioUrl = URL.createObjectURL(blob);
      S.gravando = false;
      telaApp();
    };
    rec.start();
    S.gravando = true;
    telaApp();
    setTimeout(() => { if (rec.state === 'recording') rec.stop(); }, 60000);
  } catch (e) {
    toast('🎙️ Microfone bloqueado. Use 📁 para enviar um áudio');
  }
}

async function formAudio(inp) {
  const f = inp.files[0];
  if (!f) return;
  S.form.audioB64 = await blobBase64(f);
  S.form.audioMime = f.type || 'audio/mpeg';
  S.form.audioUrl = URL.createObjectURL(f);
  telaApp();
}

async function enviarAtividade() {
  const f = S.form;
  if (!f.fotoB64) return toast('📷 Tire uma foto primeiro');
  if (!f.audioB64) return toast('🎙️ Grave o áudio explicando');
  toast('⏳ Enviando...');
  try {
    await api('enviarAtividade', { descricao: f.descricao, foto: f.fotoB64, audio: f.audioB64, audioMime: f.audioMime });
    S.form = { descricao: '' };
    await atualizar();
    festa();
    toast('✅ Enviado!');
  } catch (e) {
    toast('❌ ' + e.message);
  }
}

function viewCarteira() {
  const lista = S.dados.carteira.slice().sort((a, b) => b.data.localeCompare(a.data));
  return `<div class="card centro luz"><div class="grande-emoji">👛</div><div class="numeral" style="font-size:48px;margin-top:8px">${real(S.dados.saldo)}</div></div>
    <div class="card">${lista.length ? lista.map(c => `
      <div class="linha"><span>${c.valor > 0 ? '➕' : '🛍️'}</span><span class="v ${c.valor > 0 ? 'pos' : 'neg'}">${real(c.valor)}</span><small>${esc(c.data)}</small></div>`).join('') : '<div class="centro grande-emoji">🪙</div>'}
    </div>`;
}

function comprarBtn(i) {
  const podes = S.dados.saldo >= Number(i.preco);
  const chave = 'c' + i.id;
  const conf = S.toqueKey === chave;
  return `<button class="tb-btn ${podes ? '' : 'off'} ${conf ? 'conf' : ''}" onclick="confirmar('${chave}', () => comprar('${i.id}'))">${conf ? '✔️' : (podes ? '🛒' : '🔒')}</button>`;
}

async function comprar(id) {
  try {
    await api('comprar', { itemId: id });
    await atualizar();
    festa();
    toast('🎉 Comprado!');
  } catch (e) {
    toast('❌ ' + e.message);
  }
}

/* ----- Loja (ambos) ----- */
function viewLoja() {
  const admin = S.dados.perfil.tipo === 'admin';
  let html = admin ? '' : `<div class="card centro" style="padding:12px"><span class="chip chip-acc">💰 ${real(S.dados.saldo)}</span></div>`;
  html += S.dados.loja.map(i => `
    <div class="item ${i.ativo === true ? '' : 'inativo'}">
      <div class="ico">${esc(i.icone)}</div>
      <div class="info"><b>${esc(i.nome)}</b><span>${real(i.preco)}</span></div>
      ${admin
        ? (i.ativo === true ? `<button class="tb-btn ${S.toqueKey === 'r' + i.id ? 'conf' : ''}" onclick="confirmar('r${i.id}', () => removerItem('${i.id}'))">${S.toqueKey === 'r' + i.id ? '✔️' : '🗑️'}</button>` : '')
        : comprarBtn(i)}
    </div>`).join('') || '<div class="card centro"><div class="grande-emoji">🛍️</div></div>';
  if (admin) {
    html += `<div class="card"><div class="cap">➕ Novo item</div>
      <input type="text" id="nIcone" placeholder="😀 ícone (emoji)" maxlength="4">
      <input type="text" id="nNome" placeholder="🧸 nome">
      <input type="number" id="nPreco" step="0.5" min="0" placeholder="💲 preço (R$)">
      <button class="btn primario" onclick="novoItem()">✅ Adicionar na loja</button></div>`;
  }
  return html;
}

async function novoItem() {
  const icone = $('#nIcone').value.trim() || '🎁';
  const nome = $('#nNome').value.trim();
  const preco = Number($('#nPreco').value);
  if (!nome || !(preco > 0)) return toast('⚠️ Preencha nome e preço');
  try {
    await api('adicionarItem', { nome, icone, preco });
    await atualizar();
    toast('✅ Item na loja');
  } catch (e) {
    toast('❌ ' + e.message);
  }
}

async function removerItem(id) {
  try {
    await api('removerItem', { itemId: id });
    await atualizar();
  } catch (e) {
    toast('❌ ' + e.message);
  }
}

/* ----- Ericky: avaliar (foco óptico: a primeira é a atual) ----- */
function viewAvaliar() {
  const pend = S.dados.atividades.filter(a => a.status === 'pendente').sort((a, b) => b.data.localeCompare(a.data));
  if (!pend.length) return '<div class="card centro"><div class="grande-emoji">🎉</div></div>';
  return pend.map((a, i) => cardAvaliar(a, i === 0)).join('');
}

function cardAvaliar(a, atual) {
  const u = S.dados.usuarios.find(x => x.id === a.usuario) || { nome: a.usuario, cor: '#888' };
  const nota = S.notas[a.id] ?? 5;
  return `<div class="card atv ${atual ? 'luz pulsa' : 'dim'}">
    <div class="atv-topo">${avatar(u, 40)}<b>${esc(u.nome)}</b><span class="cap">${esc(a.data)}</span></div>
    <img class="foto-atv" src="${fotoUrl(a.foto)}" loading="lazy">
    <audio controls preload="none" src="${audioUrl(a.audio)}"></audio>
    ${a.descricao ? `<p style="font-family:var(--f-mono);font-size:14px;color:var(--tx-3)">✏️ ${esc(a.descricao)}</p>` : ''}
    <div class="nota"><span style="font-size:26px">⭐</span>
      <input type="range" min="0" max="10" step="1" value="${nota}"
        oninput="S.notas['${a.id}']=this.value;this.nextElementSibling.textContent=this.value"><span class="numeral">${nota}</span></div>
    <div class="botoes">
      <button class="btn ok" onclick="avaliar('${a.id}', true)">✅ 💰</button>
      <button class="btn no" onclick="avaliar('${a.id}', false)">❌</button>
    </div>
  </div>`;
}

async function avaliar(id, aprovado) {
  const nota = Number(S.notas[id] ?? 5);
  try {
    await api('avaliar', { atividadeId: id, nota, aprovado });
    await atualizar();
    if (aprovado) festa();
    toast(aprovado ? '✅ +R$ 1 creditado' : '❌ Negado');
  } catch (e) {
    toast('❌ ' + e.message);
  }
}

/* ----- Ericky: dados ----- */
function setaMA(ma) {
  if (ma.length < 2) return '➡️';
  const d = ma.at(-1) - ma.at(-2);
  return d > 0.05 ? '📈' : d < -0.05 ? '📉' : '➡️';
}

function grafico(notas, ma, cor) {
  const W = 300, H = 140, P = 10, n = notas.length;
  const x = i => n < 2 ? W / 2 : P + i * (W - 2 * P) / (n - 1);
  const y = v => H - P - (v / 10) * (H - 2 * P);
  const pts = arr => arr.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  const gid = 'g' + (grafico.n = (grafico.n || 0) + 1);
  const area = `${x(0)},${H - P} ${pts(ma)} ${x(n - 1)},${H - P}`;
  return `<svg viewBox="0 0 ${W} ${H}" class="grafico">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${cor}" stop-opacity=".30"/><stop offset="1" stop-color="${cor}" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="0" x2="${W}" y1="${y(5)}" y2="${y(5)}" class="guia"/>
    <polygon points="${area}" fill="url(#${gid})"/>
    <polyline class="ma" pathLength="1000" points="${pts(ma)}"/>
    ${notas.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${cor}" style="animation-delay:${i * 70}ms"/>`).join('')}
  </svg>`;
}

function viewDados() {
  return S.dados.usuarios.map(k => {
    const cor = temaDe(k.cor).acc;
    const lista = S.dados.atividades
      .filter(a => a.usuario === k.id && a.nota !== '' && a.nota != null)
      .sort((a, b) => a.data.localeCompare(b.data));
    const notas = lista.map(a => Number(a.nota));
    const ma = notas.map((_, i) => {
      const j = notas.slice(Math.max(0, i - 2), i + 1);
      return j.reduce((s, x) => s + x, 0) / j.length;
    });
    const media = notas.length ? notas.reduce((s, x) => s + x, 0) / notas.length : 0;
    const pct = media * 10;
    const corAnel = pct >= 85 ? 'var(--ok)' : pct >= 60 ? 'var(--amber)' : 'var(--rose)';
    const dias = lista.map((a, i) => {
      const seta = i === 0 ? '➖' : ma[i] > ma[i - 1] + 0.05 ? '⬆️' : ma[i] < ma[i - 1] - 0.05 ? '⬇️' : '➡️';
      return `<div class="dia">${seta}<b class="${notas[i] >= 7 ? 'pos' : notas[i] < 5 ? 'neg' : ''}">${notas[i]}</b><small>${esc(a.data.slice(8))}</small></div>`;
    }).join('');
    return `<div class="card">
      <div class="atv-topo">${avatar(k, 44)}<b>${esc(k.nome)}</b><span class="chip chip-acc" style="margin-left:auto">💰 ${real(k.saldo)}</span></div>
      ${notas.length
        ? `<div class="dados-topo">
             ${anel(pct, `<span class="lbl">⭐</span><span class="pct">${media.toFixed(1)}</span>`, corAnel)}
             <div class="tiles">
               <div class="tile">${setaMA(ma)}<b>${ma.at(-1).toFixed(1)}</b></div>
               <div class="tile">📅<b>${notas.length}</b></div>
             </div>
           </div>
           ${grafico(notas, ma, cor)}
           <div class="legenda"><span><i style="background:${cor}"></i>nota</span><span><i style="background:var(--violet)"></i>média móvel (3 dias)</span></div>
           <div class="dias">${dias}</div>`
        : '<div class="centro grande-emoji" style="padding:12px 0">🌱</div>'}
    </div>`;
  }).join('');
}

iniciar();
</script>
