<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e1116">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏠%3C/text%3E%3C/svg%3E">
<title>SixSeven</title>
<style>
:root{--bg:#0e1116;--card:#171c24;--txt:#f2f4f7;--mut:#8b94a7;--acc:#8b94a7;--acc-txt:#0e1116;--ok:#22c55e;--bad:#ef4444;--ma:#facc15;--campo:#0f131a;--linha:#232a35}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;overflow-x:hidden}
#app{max-width:520px;margin:0 auto;padding:16px 16px 100px}
h1,h2,h3{margin:8px 0}
.titulo{font-size:28px;text-align:center}
.card{background:var(--card);border-radius:20px;padding:16px;margin:14px 0}
.centro{text-align:center}
.dica{font-size:22px;margin:10px 0}
.pessoa{display:flex;align-items:center;gap:16px;width:100%;margin:14px 0;padding:14px;background:var(--card);border:3px solid var(--c);border-radius:24px;color:var(--txt);cursor:pointer;text-align:left}
.pessoa-info{display:flex;flex-direction:column;gap:6px;font-size:30px}
.pessoa-info b{font-size:26px}
.avatar{border-radius:50%;border:4px solid var(--acc);background:#222a36;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:40px;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.btn{display:block;width:100%;font-size:22px;font-weight:700;padding:18px;border:0;border-radius:18px;background:var(--acc);color:var(--acc-txt);cursor:pointer;margin-top:10px}
.btn.ok{background:var(--ok);color:#06210f}
.btn.no{background:var(--bad);color:#fff}
.voltar{background:none;border:0;color:var(--txt);font-size:28px;align-self:flex-start;cursor:pointer}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;width:min(72vw,280px);margin:18px auto;touch-action:none;user-select:none}
.ponto{aspect-ratio:1;border-radius:50%;background:#2a313d;transition:.15s}
.ponto.on{background:var(--acc);transform:scale(1.12)}
.pontos{display:flex;gap:14px;justify-content:center;margin:16px}
.pontos i{width:20px;height:20px;border-radius:50%;background:#2a313d}
.pontos i.on{background:var(--acc)}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:300px;margin:0 auto}
.teclado button{aspect-ratio:1;border-radius:50%;border:0;background:var(--card);color:var(--txt);font-size:26px;cursor:pointer}
.topo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.topo .saldo{margin-left:auto;font-weight:700;font-size:18px}
.sair{background:none;border:0;font-size:24px;cursor:pointer}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#11151c;border-top:1px solid var(--linha);z-index:5}
.tabs button{flex:1;background:none;border:0;padding:12px 0 14px;font-size:30px;opacity:.5;cursor:pointer;border-top:3px solid transparent}
.tabs button.on{opacity:1;border-top-color:var(--acc)}
.foto-grande{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;border:2px dashed #3a4350;border-radius:18px;font-size:44px;cursor:pointer;overflow:hidden}
.foto-grande img{width:100%;height:100%;object-fit:cover}
.rec-btn{width:84px;height:84px;border-radius:50%;border:0;background:var(--acc);font-size:34px;cursor:pointer}
.rec-btn.rec{background:var(--bad);animation:pulso 1s infinite}
@keyframes pulso{50%{opacity:.5}}
.mini-btn{display:inline-flex;align-items:center;justify-content:center;font-size:22px;border:0;border-radius:14px;padding:10px 14px;background:var(--acc);color:var(--acc-txt);cursor:pointer}
.mini-btn.off{background:#2a313d;color:var(--mut)}
textarea,input[type=text],input[type=number]{width:100%;padding:14px;border-radius:14px;border:1px solid #2a313d;background:var(--campo);color:var(--txt);font-size:18px;margin:8px 0}
audio{width:100%;margin:8px 0}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px;margin:10px 0}
.item.inativo{opacity:.4}
.item .ico{font-size:40px}
.item .info{flex:1;display:flex;flex-direction:column;font-size:18px}
.item .info span{color:var(--mut)}
.linha{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linha);font-size:20px}
.linha small{margin-left:auto;color:var(--mut)}
.atv-topo{display:flex;justify-content:space-between;align-items:center;font-size:20px;gap:8px}
.foto-atv{width:100%;border-radius:16px;margin:10px 0;max-height:360px;object-fit:cover}
.nota{display:flex;align-items:center;gap:10px;font-size:22px}
.nota input{margin:0;flex:1}
.botoes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grafico{width:100%;height:150px;margin-top:8px}
.grafico circle{fill:var(--c)}
.grafico .ma{fill:none;stroke:var(--ma);stroke-width:2.5}
.grafico .guia{stroke:#2a313d;stroke-dasharray:3 4}
.tend{font-size:20px;margin:6px 0}
.legenda{font-size:14px;color:var(--mut)}
.dias{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.dia{display:flex;flex-direction:column;align-items:center;min-width:48px;font-size:18px}
.dia small{color:var(--mut)}
.grande .valor{font-size:44px;font-weight:700}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-160%);background:#fff;color:#111;padding:12px 18px;border-radius:14px;font-size:18px;transition:.3s;z-index:9;max-width:92vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"><div class="card centro">⏳ Carregando...</div></div>
<div id="toast"></div>

<script>
/* ===== CONFIG ===== */
const API = 'COLE_AQUI_A_URL_DO_APPS_SCRIPT';

/* ===== ESTADO ===== */
const $ = s => document.querySelector(s);
const app = $('#app');
const S = { usuarios: [], escolhido: null, user: null, hash: null, dados: null, aba: 'inicio',
  entrada: '', passo: 1, p1: null, fotoB64: null, fotoPrev: null, form: { descricao: '' },
  gravando: false, rec: null, notas: {}, toqueKey: null };

/* ===== HELPERS ===== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const real = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(v) || 0);
const fotoUrl = id => id ? `https://drive.google.com/thumbnail?sz=w800&id=${id}` : '';
const audioUrl = id => id ? `https://drive.google.com/uc?export=download&id=${id}` : '';

function toast(m) {
  const t = $('#toast');
  t.textContent = m;
  t.classList.add('on');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('on'), 2600);
}

async function sha(texto) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}

const blobBase64 = b => new Promise(ok => {
  const r = new FileReader();
  r.onload = () => ok(r.result.split(',')[1]);
  r.readAsDataURL(b);
});

function lerImagem(file, lado) {
  return new Promise((ok, err) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, lado / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', 0.7).split(',')[1]);
    };
    img.onerror = err;
    img.src = URL.createObjectURL(file);
  });
}

function tema(cor) {
  const s = document.documentElement.style;
  s.setProperty('--acc', cor || '#8b94a7');
  s.setProperty('--acc-txt', cor === '#3b82f6' ? '#fff' : '#0e1116');
}

function avatar(u, tam = 96) {
  const img = u.foto ? `<img src="${fotoUrl(u.foto)}">` : (u.tipo === 'admin' ? '👑' : '🧒');
  return `<div class="avatar" style="width:${tam}px;height:${tam}px;border-color:${esc(u.cor)}">${img}</div>`;
}

async function api(acao, extra = {}) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ acao, user: S.user, hash: S.hash, ...extra }),
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.erro || 'Erro');
  return j;
}

function guardarSessao() {
  try { sessionStorage.setItem('sixseven', JSON.stringify({ user: S.user, hash: S.hash })); } catch (e) {}
}
function lerSessao() {
  try { return JSON.parse(sessionStorage.getItem('sixseven')); } catch (e) { return null; }
}
function limparSessao() {
  try { sessionStorage.removeItem('sixseven'); } catch (e) {}
}

/* ===== INÍCIO ===== */
async function iniciar() {
  try {
    const r = await fetch(API).then(x => x.json());
    S.usuarios = r.usuarios;
  } catch (e) {
    app.innerHTML = '<div class="card centro">⚠️ Não consegui falar com o banco de dados.<br>Confira a URL da API.</div>';
    return;
  }
  const sess = lerSessao();
  if (sess && sess.user) {
    S.user = sess.user;
    S.hash = sess.hash;
    S.escolhido = S.usuarios.find(u => u.id === sess.user);
    try {
      S.dados = await api('entrar');
      S.aba = S.dados.perfil.tipo === 'admin' ? 'avaliar' : 'inicio';
      return telaApp();
    } catch (e) {
      S.user = S.hash = null;
      limparSessao();
    }
  }
  telaHome();
}

function telaHome() {
  S.user = S.hash = S.dados = null;
  limparSessao();
  tema(null);
  app.innerHTML = `<h1 class="titulo">🏠 Quem é você?</h1>` + S.usuarios.map(u => `
    <button class="pessoa" style="--c:${esc(u.cor)}" onclick="escolher('${esc(u.id)}')">
      ${avatar(u, 96)}
      <div class="pessoa-info"><b>${esc(u.nome)}</b><span>${u.tipo === 'admin' ? '👑' : '🧒'} ${u.configurado ? '🔒' : '🆕'}</span></div>
    </button>`).join('');
}

function escolher(id) {
  S.escolhido = S.usuarios.find(u => u.id === id);
  S.entrada = '';
  S.passo = 1;
  S.p1 = null;
  S.fotoB64 = S.fotoPrev = null;
  telaLogin();
}

/* ===== LOGIN / PRIMEIRO ACESSO ===== */
function grade() {
  return `<div class="grade" id="grade">${Array.from({ length: 9 }, (_, i) => `<div class="ponto" data-i="${i}"></div>`).join('')}</div>`;
}

function ligarGrade(fim) {
  const g = $('#grade');
  let seq = [], ativo = false;
  const tocar = e => {
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const i = el?.dataset?.i;
    if (i == null || seq.includes(+i)) return;
    seq.push(+i);
    el.classList.add('on');
  };
  g.onpointerdown = e => {
    seq = [];
    g.querySelectorAll('.ponto').forEach(p => p.classList.remove('on'));
    g.setPointerCapture(e.pointerId);
    ativo = true;
    tocar(e);
  };
  g.onpointermove = e => { if (ativo) tocar(e); };
  g.onpointerup = () => {
    if (!ativo) return;
    ativo = false;
    fim(seq.slice());
  };
}

function telaLogin() {
  const u = S.escolhido;
  tema(u.cor);
  const cab = `<button class="voltar" onclick="telaHome()">⬅️</button>${avatar(u, 110)}<h2>${esc(u.nome)}</h2>`;
  if (!u.configurado) return primeiroAcesso(cab);

  if (u.tipo === 'admin') {
    app.innerHTML = `<div class="centro">${cab}
      <div class="pontos">${[0, 1, 2, 3].map(i => `<i class="${i < S.entrada.length ? 'on' : ''}"></i>`).join('')}</div>
      <div class="teclado">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => k === '' ? '<span></span>' : `<button onclick="tecla('${k}')">${k}</button>`).join('')}</div>
    </div>`;
    return;
  }

  app.innerHTML = `<div class="centro">${cab}<p class="dica">🔒 Desenhe seu padrão</p>${grade()}</div>`;
  ligarGrade(p => {
    if (p.length < 4) { toast('⚠️ Use pelo menos 4 pontinhos'); return telaLogin(); }
    entrar(p.join('-'));
  });
}

function tecla(k) {
  if (k === '⌫') S.entrada = S.entrada.slice(0, -1);
  else if (S.entrada.length < 4) S.entrada += k;
  if (S.entrada.length === 4) {
    const pin = S.entrada;
    S.entrada = '';
    return entrar(pin);
  }
  telaLogin();
}

async function entrar(texto) {
  S.user = S.escolhido.id;
  S.hash = await sha(texto);
  try {
    S.dados = await api('entrar');
    guardarSessao();
    S.aba = S.dados.perfil.tipo === 'admin' ? 'avaliar' : 'inicio';
    telaApp();
  } catch (e) {
    S.user = S.hash = null;
    toast('❌ ' + e.message);
    telaLogin();
  }
}

function primeiroAcesso(cab) {
  if (S.passo < 3) {
    app.innerHTML = `<div class="centro">${cab}<p class="dica">${S.passo === 1 ? '1️⃣ Crie seu padrão 🔒' : '2️⃣ Desenhe de novo ✅'}</p>${grade()}</div>`;
    ligarGrade(p => {
      const t = p.join('-');
      if (p.length < 4) { toast('⚠️ Use pelo menos 4 pontinhos'); return telaLogin(); }
      if (S.passo === 1) { S.p1 = t; S.passo = 2; return telaLogin(); }
      if (t !== S.p1) { toast('❌ Não bateu, tente de novo'); S.passo = 1; return telaLogin(); }
      S.passo = 3;
      telaLogin();
    });
    return;
  }
  app.innerHTML = `<div class="centro">${cab}<p class="dica">3️⃣ Escolha sua foto 📷</p>
    <label class="foto-grande" style="width:200px;height:200px;border-radius:50%;margin:0 auto">
      ${S.fotoPrev ? `<img src="${S.fotoPrev}">` : '📷'}
      <input type="file" accept="image/*" capture="user" hidden onchange="fotoPerfil(this)">
    </label>
    <button class="btn" onclick="salvarPerfil()">✅ Pronto</button>
  </div>`;
}

async function fotoPerfil(inp) {
  const f = inp.files[0];
  if (!f) return;
  S.fotoB64 = await lerImagem(f, 300);
  S.fotoPrev = 'data:image/jpeg;base64,' + S.fotoB64;
  telaLogin();
}

async function salvarPerfil() {
  if (!S.fotoB64) return toast('📷 Escolha sua foto');
  S.user = S.escolhido.id;
  S.hash = await sha(S.p1);
  try {
    await api('configurar', { foto: S.fotoB64 });
    S.escolhido.configurado = true;
    S.passo = 1;
    S.fotoB64 = S.fotoPrev = null;
    await entrar(S.p1);
  } catch (e) {
    toast('❌ ' + e.message);
  }
}

/* ===== APP ===== */
async function atualizar() {
  S.dados = await api('entrar');
  telaApp();
}

function irAba(a) {
  S.aba = a;
  telaApp();
}

function sair() {
  S.user = S.hash = S.dados = null;
  S.form = { descricao: '' };
  limparSessao();
  telaHome();
}

function confirmar(chave, acao) {
  if (S.toqueKey !== chave) {
    S.toqueKey = chave;
    telaApp();
    return toast('Toque de novo para confirmar');
  }
  S.toqueKey = null;
  acao();
}

function telaApp() {
  const p = S.dados.perfil;
  const admin = p.tipo === 'admin';
  tema(p.cor);
  const abas = admin
    ? [['avaliar', '📋'], ['dados', '📊'], ['loja', '🛒']]
    : [['inicio', '🏠'], ['carteira', '👛'], ['loja', '🛒']];
  const vistas = { inicio: viewInicio, carteira: viewCarteira, loja: viewLoja, avaliar: viewAvaliar, dados: viewDados };
  app.innerHTML = `
    <header class="topo">${avatar(p, 48)}<b>${esc(p.nome)}</b>
      ${admin ? '' : `<span class="saldo">💰 ${real(S.dados.saldo)}</span>`}
      <button class="sair" onclick="sair()">🚪</button>
    </header>
    <main>${vistas[S.aba]()}</main>
    <nav class="tabs">${abas.map(([k, ic]) => `<button class="${S.aba === k ? 'on' : ''}" onclick="irAba('${k}')">${ic}</button>`).join('')}</nav>`;
}

/* ----- Crianças ----- */
function viewInicio() {
  const h = S.dados.hoje;
  if (h.diaSemana > 5) {
    return `<div class="card centro"><div style="font-size:70px">🏖️</div><h2>Fim de semana</h2><p>Descansa! Volta na segunda 😊</p></div>`;
  }
  const hj = S.dados.atividades.find(a => a.data === h.data);
  if (hj) {
    const st = { pendente: ['⏳', 'Esperando ver'], aprovado: ['✅', '+R$ 1'], negado: ['❌', 'Não dessa vez'] }[hj.status];
    return `<div class="card centro">
      <div style="font-size:70px">${st[0]}</div><p>${st[1]}</p>
      ${hj.nota !== '' && hj.nota != null ? `<p>⭐ ${hj.nota}/10</p>` : ''}
      <img class="foto-atv" src="${fotoUrl(hj.foto)}">
    </div>`;
  }
  const f = S.form;
  return `<div class="card">
    <div class="centro"><div style="font-size:44px">📸🛏️</div><h3>Atividade de hoje</h3></div>
    <label class="foto-grande">${f.fotoPrev ? `<img src="${f.fotoPrev}">` : '📷<small>tirar foto</small>'}
      <input type="file" accept="image/*" capture="environment" hidden onchange="formFoto(this)">
    </label>
    <div class="centro" style="margin:16px 0;display:flex;justify-content:center;gap:14px;align-items:center">
      <button class="rec-btn ${S.gravando ? 'rec' : ''}" onclick="gravar()">${S.gravando ? '⏹️' : '🎙️'}</button>
      <label class="mini-btn">📁<input type="file" accept="audio/*" hidden onchange="formAudio(this)"></label>
    </div>
    ${f.audioUrl ? `<audio controls src="${f.audioUrl}"></audio>` : ''}
    <textarea placeholder="✏️ (opcional)" oninput="S.form.descricao=this.value">${esc(f.descricao)}</textarea>
    <button class="btn" onclick="enviarAtividade()">📤 Enviar</button>
  </div>`;
}

async function formFoto(inp) {
  const f = inp.files[0];
  if (!f) return;
  S.form.fotoB64 = await lerImagem(f, 900);
  S.form.fotoPrev = 'data:image/jpeg;base64,' + S.form.fotoB64;
  telaApp();
}

async function gravar() {
  if (S.rec && S.rec.state === 'recording') return S.rec.stop();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const rec = S.rec = new MediaRecorder(stream);
    const partes = [];
    rec.ondataavailable = e => partes.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(partes, { type: rec.mimeType || 'audio/webm' });
      S.form.audioB64 = await blobBase64(blob);
      S.form.audioMime = blob.type;
      S.form.audioUrl = URL.createObjectURL(blob);
      S.gravando = false;
      telaApp();
    };
    rec.start();
    S.gravando = true;
    telaApp();
    setTimeout(() => { if (rec.state === 'recording') rec.stop(); }, 60000); // máximo 1 minuto
  } catch (e) {
    toast('🎙️ Microfone bloqueado. Use 📁 para enviar um áudio');
  }
}

async function formAudio(inp) {
  const f = inp.files[0];
  if (!f) return;
  S.form.audioB64 = await blobBase64(f);
  S.form.audioMime = f.type || 'audio/mpeg';
  S.form.audioUrl = URL.createObjectURL(f);
  telaApp();
}

async function enviarAtividade() {
  const f = S.form;
  if (!f.fotoB64) return toast('📷 Tire uma foto primeiro');
  if (!f.audioB64) return toast('🎙️ Grave o áudio explicando');
  toast('⏳ Enviando...');
  try {
    await api('enviarAtividade', { descricao: f.descricao, foto: f.fotoB64, audio: f.audioB64, audioMime: f.audioMime });
    S.form = { descricao: '' };
    await atualizar();
    toast('✅ Enviado!');
  } catch (e) {
    toast('❌ ' + e.message);
  }
}

function viewCarteira() {
  const lista = S.dados.carteira.slice().sort((a, b) => b.data.localeCompare(a.data));
  return `<div class="card centro grande"><div style="font-size:50px">👛</div><div class="valor">${real(S.dados.saldo)}</div></div>
    <div class="card">${lista.length ? lista.map(c => `
      <div class="linha"><span>${c.valor > 0 ? '➕' : '➖'}</span><span>${real(c.valor)}</span><small>${esc(c.data)}</small></div>`).join('') : '🪙 Nada ainda'}
    </div>`;
}

function comprarBtn(i) {
  const podes = S.dados.saldo >= Number(i.preco);
  const chave = 'c' + i.id;
  const icone = S.toqueKey === chave ? '✔️' : (podes ? '🛒' : '🔒');
  return `<button class="mini-btn ${podes ? '' : 'off'}" onclick="confirmar('${chave}', () => comprar('${i.id}'))">${icone}</button>`;
}

async function comprar(id) {
  try {
    await api('comprar', { itemId: id });
    await atualizar();
    toast('🎉 Comprado!');
  } catch (e) {
    toast('❌ ' + e.message);
  }
}

/* ----- Loja (ambos) ----- */
function viewLoja() {
  const admin = S.dados.perfil.tipo === 'admin';
  let html = S.dados.loja.map(i => `
    <div class="item ${i.ativo === true ? '' : 'inativo'}">
      <div class="ico">${esc(i.icone)}</div>
      <div class="info"><b>${esc(i.nome)}</b><span>${real(i.preco)}</span></div>
      ${admin
        ? (i.ativo === true ? `<button class="mini-btn" onclick="confirmar('r${i.id}', () => removerItem('${i.id}'))">${S.toqueKey === 'r' + i.id ? '✔️' : '🗑️'}</button>` : '')
        : comprarBtn(i)}
    </div>`).join('') || '<div class="card centro">🛍️ Loja vazia</div>';
  if (admin) {
    html += `<div class="card"><h3>➕ Novo item</h3>
      <input type="text" id="nIcone" placeholder="😀 ícone (emoji)" maxlength="4">
      <input type="text" id="nNome" placeholder="🧸 nome">
      <input type="number" id="nPreco" step="0.5" min="0" placeholder="💲 preço (R$)">
      <button class="btn" onclick="novoItem()">✅ Adicionar na loja</button></div>`;
  }
  return html;
}

async function novoItem() {
  const icone = $('#nIcone').value.trim() || '🎁';
  const nome = $('#nNome').value.trim();
  const preco = Number($('#nPreco').value);
  if (!nome || !(preco > 0)) return toast('Preencha nome e preço');
  try {
    await api('adicionarItem', { nome, icone, preco });
    await atualizar();
    toast('✅ Item na loja');
  } catch (e) {
    toast('❌ ' + e.message);
  }
}

async function removerItem(id) {
  try {
    await api('removerItem', { itemId: id });
    await atualizar();
  } catch (e) {
    toast('❌ ' + e.message);
  }
}

/* ----- Ericky: avaliar ----- */
function viewAvaliar() {
  const pend = S.dados.atividades.filter(a => a.status === 'pendente').sort((a, b) => b.data.localeCompare(a.data));
  if (!pend.length) return '<div class="card centro"><div style="font-size:60px">🎉</div>Nada para avaliar</div>';
  return pend.map(cardAvaliar).join('');
}

function cardAvaliar(a) {
  const u = S.dados.usuarios.find(x => x.id === a.usuario) || { nome: a.usuario, cor: '#888' };
  const nota = S.notas[a.id] ?? 5;
  return `<div class="card" style="--c:${esc(u.cor)}">
    <div class="atv-topo"><b>${esc(u.nome)}</b><span>${esc(a.data)}</span></div>
    <img class="foto-atv" src="${fotoUrl(a.foto)}" loading="lazy">
    <audio controls preload="none" src="${audioUrl(a.audio)}"></audio>
    ${a.descricao ? `<p>✏️ ${esc(a.descricao)}</p>` : ''}
    <div class="nota"><span>⭐</span>
      <input type="range" min="0" max="10" step="1" value="${nota}"
        oninput="S.notas['${a.id}']=this.value;this.nextElementSibling.textContent=this.value"><b>${nota}</b></div>
    <div class="botoes" style="margin-top:12px">
      <button class="btn ok" onclick="avaliar('${a.id}', true)">✅ 💰</button>
      <button class="btn no" onclick="avaliar('${a.id}', false)">❌</button>
    </div>
  </div>`;
}

async function avaliar(id, aprovado) {
  const nota = Number(S.notas[id] ?? 5);
  try {
    await api('avaliar', { atividadeId: id, nota, aprovado });
    await atualizar();
    toast(aprovado ? '✅ +R$ 1 creditado' : '❌ Negado');
  } catch (e) {
    toast('❌ ' + e.message);
  }
}

/* ----- Ericky: dados ----- */
function setaMA(ma) {
  if (ma.length < 2) return { i: '➡️', t: 'Começando' };
  const d = ma.at(-1) - ma.at(-2);
  return d > 0.05 ? { i: '📈', t: 'Subindo' } : d < -0.05 ? { i: '📉', t: 'Caindo' } : { i: '➡️', t: 'Estável' };
}

function grafico(notas, ma) {
  const W = 300, H = 140, P = 10, n = notas.length;
  const x = i => n < 2 ? W / 2 : P + i * (W - 2 * P) / (n - 1);
  const y = v => H - P - (v / 10) * (H - 2 * P);
  const pts = arr => arr.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" class="grafico">
    <line x1="0" x2="${W}" y1="${y(5)}" y2="${y(5)}" class="guia"/>
    <polyline class="ma" points="${pts(ma)}"/>
    ${notas.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4"/>`).join('')}
  </svg>`;
}

function viewDados() {
  return S.dados.usuarios.map(k => {
    const lista = S.dados.atividades
      .filter(a => a.usuario === k.id && a.nota !== '' && a.nota != null)
      .sort((a, b) => a.data.localeCompare(b.data));
    const notas = lista.map(a => Number(a.nota));
    const ma = notas.map((_, i) => {
      const j = notas.slice(Math.max(0, i - 2), i + 1);
      return j.reduce((s, x) => s + x, 0) / j.length;
    });
    const t = setaMA(ma);
    const media = notas.length ? notas.reduce((s, x) => s + x, 0) / notas.length : 0;
    const dias = lista.map((a, i) => {
      const seta = i === 0 ? '➖' : ma[i] > ma[i - 1] + 0.05 ? '⬆️' : ma[i] < ma[i - 1] - 0.05 ? '⬇️' : '➡️';
      return `<div class="dia" title="${esc(a.data)}">${seta}<b>${notas[i]}</b><small>${esc(a.data.slice(8))}</small></div>`;
    }).join('');
    return `<div class="card" style="--c:${esc(k.cor)}">
      <div class="atv-topo"><b>${esc(k.nome)}</b><span>💰 ${real(k.saldo)}</span></div>
      ${notas.length
        ? `<p class="tend">${t.i} ${t.t} · ⭐ média ${media.toFixed(1)} · 📅 ${notas.length}</p>
           ${grafico(notas, ma)}
           <p class="legenda">🔵 nota do dia &nbsp; 🟡 média móvel (3 dias)</p>
           <div class="dias">${dias}</div>`
        : '<p>🌱 Sem notas ainda</p>'}
    </div>`;
  }).join('');
}

iniciar();
</script>
</body>
</html>
